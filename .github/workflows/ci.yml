# CI policy (docs/lld/01-repository-and-runtime.md §3.10; owner decision 2026-10-13):
# on demand, on the release-gate branch, and on pull requests while this repository is public,
# where standard runners cost nothing. Windows runs on pull requests only. tests/guards lints this file.
name: ci

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        type: choice
        options: [all, unit, guards]
        default: all
  push:
    branches: [test]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SUITE: ${{ inputs.suite }}

jobs:
  tests:
    if: ${{ github.event_name != 'pull_request' || !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install PyYAML
      - name: Run tests
        shell: bash
        run: |
          case "$SUITE" in
            unit|guards) start="tests/$SUITE" ;;
            *) start="tests" ;;
          esac
          python -W error -m unittest discover -s "$start" -t .

  tests-windows:
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install PyYAML
      - name: Run tests
        run: python -W error -m unittest discover -s tests -t .
