# CI policy (docs/lld/01-repository-and-runtime.md §3.10): on demand and on the release-gate branch only.
# Never on pull_request, never on other pushes, never on Windows. tests/guards lints this file.
name: ci

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        type: choice
        options: [all, unit, guards]
        default: all
  push:
    branches: [test]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUITE: ${{ inputs.suite }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install PyYAML
      - name: Run tests
        run: |
          case "$SUITE" in
            unit|guards) start="tests/$SUITE" ;;
            *) start="tests" ;;
          esac
          python -W error -m unittest discover -s "$start" -t .
