# Synthetic fixture: the reference development standard as a client standards bundle.
schema: client_standards_bundle.v1
client_id: acme-b
version: 1.0.0
approved:
  by: acme-b-architect@example.invalid
  at: 2026-10-13T10:00:00Z
project:
  mule_runtime: 4.9.1
  java: 17
  group_id: acme-b-org-id
  golden_parent:
    group_id: acme-b-org-id
    artifact_id: acme-b-mule-parent
    version: 1.0.0
  allowed_plugins:
    - org.mule.tools.maven:mule-maven-plugin
  forbidden_paths:
    - .github/**
    - .mvn/**
    - mvnw*
    - "*.key"
    - "*.pem"
  require_mule_artifact: true
  gitignore_required: [settings.xml, .env, "*.key", target/]
  child_pom:
    forbid_versions: true
    forbid_profiles: true
    forbid_final_name: true
    require_semver: true
    artifact_is_repository_name: true
connectors:
  allowed:
    - org.mule.connectors:mule-http-connector
    - org.mule.modules:mule-apikit-module
    - com.mulesoft.modules:mule-secure-configuration-property-module
    - com.mulesoft.munit:munit-runner
    - com.mulesoft.munit:munit-tools
  values_from_properties: true
  require_http_timeouts: true
api:
  default_contract: oas30
  apikit: required
  autodiscovery: required
configuration:
  layout: deployment_properties
patterns:
  implementation_flow: "[a-z]+(-[a-z0-9]+)+-flow"
  sub_flow: "[a-z]+(-[a-z0-9]+)+-subflow"
  connector_config: "[a-z0-9]+(-[a-z0-9]+)+-config"
  property_key: "[a-z][a-z0-9]*(\\.[a-z][a-z0-9-]*)+"
  flow_variable: "[a-z][A-Za-z0-9]*"
  error_type: "APP:[A-Z][A-Z0-9_]*"
  object_store: "[a-z0-9]+(-[a-z0-9]+)*-os"
  feature_flag: "feature\\.[a-z0-9-]+\\.enabled"
  dataweave_script: "dwl/[a-z0-9-]+/[a-z0-9-]+\\.dwl"
  dataweave_module: "modules/[A-Z][A-Za-z0-9]*\\.dwl"
  listener_path: "/api/v[1-9][0-9]*/\\*"
  mule_file: "(global|error-handler|[a-z0-9-]+-api|[a-z0-9-]+-impl)\\.xml"
error_handling:
  handler_file: error-handler.xml
  forbid_continue_on_any: true
  envelope_script: dwl/common/error-response.dwl
  mappings:  # the reference standard's table
    - {types: ["APIKIT:BAD_REQUEST", "APP:VALIDATION"], status: 400}
    - {types: ["APIKIT:NOT_FOUND", "APP:*_NOT_FOUND"], status: 404}
    - {types: ["APIKIT:METHOD_NOT_ALLOWED"], status: 405}
    - {types: ["APIKIT:NOT_ACCEPTABLE"], status: 406}
    - {types: ["APP:CONFLICT"], status: 409}
    - {types: ["APIKIT:UNSUPPORTED_MEDIA_TYPE"], status: 415}
    - {types: ["APP:BUSINESS_RULE"], status: 422}
    - {types: ["APIKIT:NOT_IMPLEMENTED"], status: 501}
    - {types: ["HTTP:BAD_GATEWAY", "HTTP:INTERNAL_SERVER_ERROR"], status: 502}
    - {types: ["*:CONNECTIVITY", "HTTP:SERVICE_UNAVAILABLE"], status: 503}
    - {types: ["HTTP:TIMEOUT"], status: 504}
    - {types: ["ANY"], status: 500}
logging:
  style: json_logger_module
  forbid_free_text_logger: true
  log_event_subflow: log-event-subflow
  forbid_trace: true
  root_levels: [INFO, WARN, ERROR]
  required_fields: [timestamp, level, appName, env, correlationId, flowName, message]
testing:
  minimum_application_coverage: 75
  forbid_sleep: true
  ignored_needs_ticket: "[A-Z][A-Z0-9]+-[0-9]+"
  suite_per_implementation: "-impl.xml"
